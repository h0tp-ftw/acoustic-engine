version: '3.8'

services:
  engine:
    build: .
    container_name: acoustic-engine
    volumes:
      - .:/app
    devices:
      - /dev/snd:/dev/snd
    environment:
      - ACOUSTIC_CONFIG=config.example.yaml

  validate:
    build: .
    container_name: acoustic-validate
    ports:
      - "8787:8787"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: python -m acoustic_engine.tuner --port 8787 --host 0.0.0.0

  tests:
    build: .
    container_name: acoustic-tests
    volumes:
      - .:/app
    command: pytest tests/ -v
