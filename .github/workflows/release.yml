name: Release

# Push a version tag (e.g. v1.2.0) and this does the rest:
#   1. builds + checks the sdist/wheel
#   2. creates a GitHub Release, with notes auto-filled from CHANGELOG.md
#   3. publishes to PyPI via Trusted Publishing (OIDC — no token/secret)
#
# Release in one step:   git tag v1.2.0 && git push origin v1.2.0

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Generate release notes from CHANGELOG
        run: python scripts/changelog.py notes "${GITHUB_REF_NAME#v}" > RELEASE_NOTES.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --repo "$GITHUB_REPOSITORY"

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/acoustic-engine/
    permissions:
      id-token: write   # Trusted Publishing (OIDC) — no API token required
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Default: Trusted Publishing. To use an API token in GitHub Secrets
        # instead, remove the `permissions:` block above and add:
        #   with:
        #     password: ${{ secrets.PYPI_API_TOKEN }}
