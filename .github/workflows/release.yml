name: Release

# Two ways to cut a release — both end at a GitHub Release + a PyPI publish:
#
#   • Button (recommended): Actions → Release → "Run workflow" → type the version
#     (e.g. 1.3.0). This bumps pyproject.toml + __init__.py, updates CHANGELOG.md,
#     commits, tags v1.3.0, then builds and publishes — all in this one run.
#
#   • Tag (power users): `git tag v1.3.0 && git push origin v1.3.0`. You've already
#     bumped/committed; this just builds and publishes.
#
# PyPI uses Trusted Publishing (OIDC) — configure the `acoustic-engine` project's
# trusted publisher once: repo h0tp-ftw/acoustic-engine, workflow release.yml,
# environment `pypi`. (Or remove the pypi job's `permissions:` and pass an API
# token via `with: password: ${{ secrets.PYPI_API_TOKEN }}`.)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.3.0 (no leading v)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the bump + push the tag on a manual run
    outputs:
      version: ${{ steps.prep.outputs.version }}
      tag: ${{ steps.prep.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version (and prepare the release on a manual run)
        id: prep
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            echo "Preparing release $VERSION on ${{ github.ref_name }}"

            sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
            sed -i "s/^__version__ = .*/__version__ = \"$VERSION\"/" src/acoustic_engine/__init__.py

            # Idempotent: only generate a changelog section if one isn't there yet
            # (so re-running, or releasing a version you already curated, is safe).
            if ! grep -qE "^## ${VERSION}([[:space:]]|$)" CHANGELOG.md; then
              python scripts/changelog.py update "$VERSION"
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "release: $VERSION"
              git push origin "HEAD:${{ github.ref_name }}"
            fi
            if ! git rev-parse "v$VERSION" >/dev/null 2>&1; then
              git tag "v$VERSION"
            fi
            git push origin "v$VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the Release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Generate release notes from CHANGELOG
        run: python scripts/changelog.py notes "${{ needs.build.outputs.version }}" > RELEASE_NOTES.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.build.outputs.tag }}" dist/* \
            --title "${{ needs.build.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md \
            --repo "$GITHUB_REPOSITORY"

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/acoustic-engine/
    permissions:
      id-token: write # Trusted Publishing (OIDC) — no API token required
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Default: Trusted Publishing. To use an API token in GitHub Secrets
        # instead, remove the `permissions:` block above and add:
        #   with:
        #     password: ${{ secrets.PYPI_API_TOKEN }}
