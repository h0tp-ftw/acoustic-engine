name: Release

# Releases happen three ways — all converge on a GitHub Release + a PyPI publish.
#
#   • Auto (recommended): bump the version in pyproject.toml + __init__.py and add
#     a CHANGELOG.md section in a PR. When it merges to main, this workflow notices
#     the new version, tags v<version>, builds, and publishes. Nothing else to do.
#
#   • Button: Actions → Release → "Run workflow" → type the version (e.g. 1.3.0).
#     Bumps the files + changelog, commits, tags, then builds and publishes.
#
#   • Tag: git tag v1.3.0 && git push origin v1.3.0.
#
# A push to main that does NOT change the version is a no-op (the version is
# already tagged), so this is safe to run on every merge. Tags pushed by this
# workflow (via GITHUB_TOKEN) don't re-trigger it, so there's never a double run.
#
# PyPI uses Trusted Publishing (OIDC): the `acoustic-engine` project must trust
# repo h0tp-ftw/acoustic-engine, workflow release.yml, environment `pypi`.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.3.0 (no leading v)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the bump / push the tag
    outputs:
      version: ${{ steps.prep.outputs.version }}
      tag: ${{ steps.prep.outputs.tag }}
      release: ${{ steps.prep.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history + tags, so the "already released?" check works

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve version & decide whether to release
        id: prep
        run: |
          set -euo pipefail
          RELEASE=true

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # --- Manual button: bump files + changelog, commit, tag ---
            VERSION="${{ inputs.version }}"; VERSION="${VERSION#v}"
            echo "Manual release of $VERSION on ${{ github.ref_name }}"
            sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
            sed -i "s/^__version__ = .*/__version__ = \"$VERSION\"/" src/acoustic_engine/__init__.py
            if ! grep -qE "^## ${VERSION}([[:space:]]|$)" CHANGELOG.md; then
              python scripts/changelog.py update "$VERSION"
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "release: $VERSION"
              git push origin "HEAD:${{ github.ref_name }}"
            fi
            git rev-parse "v$VERSION" >/dev/null 2>&1 || git tag "v$VERSION"
            git push origin "v$VERSION"

          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            # --- Tag push: already bumped & tagged by a human ---
            VERSION="${GITHUB_REF_NAME#v}"
            echo "Tag release of $VERSION"

          else
            # --- Push to main: release only if the version is new ---
            VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            if git rev-parse "v$VERSION" >/dev/null 2>&1; then
              echo "v$VERSION is already released — nothing to do."
              RELEASE=false
            else
              INIT=$(python -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('src/acoustic_engine/__init__.py').read()).group(1))")
              if [ "$INIT" != "$VERSION" ]; then
                echo "::error::pyproject version ($VERSION) != __init__ __version__ ($INIT). Bump both."
                exit 1
              fi
              echo "New version $VERSION detected on main — releasing."
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag "v$VERSION"
              git push origin "v$VERSION"
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Build and check
        if: steps.prep.outputs.release == 'true'
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v5
        if: steps.prep.outputs.release == 'true'
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the Release
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - name: Generate release notes from CHANGELOG
        run: python scripts/changelog.py notes "${{ needs.build.outputs.version }}" > RELEASE_NOTES.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.build.outputs.tag }}" dist/* \
            --title "${{ needs.build.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md \
            --repo "$GITHUB_REPOSITORY"

  pypi:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/acoustic-engine/
    permissions:
      id-token: write # Trusted Publishing (OIDC) — no API token required
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Default: Trusted Publishing. To use an API token in GitHub Secrets
        # instead, remove the `permissions:` block above and add:
        #   with:
        #     password: ${{ secrets.PYPI_API_TOKEN }}
