<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acoustic Engine | Pro Tuner</title>
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🔊 Acoustic Pro Tuner</h1>
            <p class="subtitle">Diagnostic-grade alarm pattern engineering</p>
        </header>

        <main id="tunerApp">
            <!-- Framework Shell Placeholder -->
            <div class="glass-panel">
                <h2>Framework Initialized</h2>
                <p>Waiting for walk-through instructions...</p>
                <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                    <button onclick="console.error('Manual Test Error')" style="background: var(--primary); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer;">Test Console Error</button>
                    <button onclick="throw new Error('Crash Test Error')" style="background: var(--secondary); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer;">Test App Crash</button>
                </div>
            </div>
        </main>

        <!-- System Status HUD -->
        <div class="status-hud">
            <div class="status-indicator"></div>
            <span>SYSTEM READY</span>
            <span style="opacity: 0.3">|</span>
            <span id="terminal-sync">DBRG SYNCED</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
